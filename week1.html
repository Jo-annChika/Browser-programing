<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jo-ann — Browser Programming</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #1a1a1a;
      --paper:     #fafafa;
      --lilac:     #9b84c4;
      --lilac-soft:#ede8f7;
      --muted:     #888;
      --rule:      #e0e0e0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeDown .5s ease both;
    }

    .logo {
      font-size: .7rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logo span { color: var(--lilac); }

    .year {
      font-size: .7rem;
      letter-spacing: .12em;
      color: var(--rule);
    }

    main {
      flex: 1;
      padding: 5rem 2.5rem 4rem;
      max-width: 720px;
      animation: fadeUp .6s .15s ease both;
    }

    .label {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--lilac);
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -.01em;
      margin-bottom: 1.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--lilac);
    }

    .bio {
      font-size: .82rem;
      line-height: 1.9;
      color: var(--muted);
      max-width: 460px;
    }

    footer {
      padding: 1.2rem 2.5rem;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeUp .5s .3s ease both;
    }

    footer p {
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--rule);
    }

    footer span {
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--lilac);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
      main { padding-top: 3rem; }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">Browser <span>Programming</span></span>
    <span class="year">2026</span>
  </header>

  <main>
    <p class="label">Portfolio</p>
    <h1>Hi, I'm <em>Jo-ann.</em></h1>
    <p class="bio">
      I am a student at Savonia studying IoT Engineering. This is my browser programming portfolio.
    </p>
  </main>

  <footer>
    <p>Jo-ann &mdash; Browser Programming</p>
    <span>Week 01</span>
  </footer>

</body>
</html>
